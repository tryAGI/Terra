        gender:
          anyOf:
          - type: string
          - type: 'null'
          description: User's gender.
          example: male
        account_creation_date:
          anyOf:
          - type: string
          - type: 'null'
          description: User's account creation date with the provider, in ISO8601 format.
          example: '2023-01-15'
        provider_user_id:
          anyOf:
          - type: string
          - type: 'null'
