          - type: 'null'
          description: End of the set, ISO 8601. Null when the source does not timestamp sets.
        load_type:
          $ref: '#/components/schemas/StrengthLoadType'
          description: 'How to read weight_kg. Always present: every set that happened was loaded somehow, so a set Terra could not classify reports `unknown` rather than omitting the field. Open enum —
            handle unknown values gracefully. Only external means weight_kg is load added to an otherwise unloaded body, so compute volume from external sets alone. Test for external rather than testing
            against the other values: a load type you do not recognise must be treated as unknown, because counting it as external overstates the load.'
          example: external
        notes:
          anyOf:
          - type: string
          - type: 'null'
          description: The user's note on this specific set.
        reps:
          anyOf:
          - type: integer
          - type: 'null'
          description: Repetitions performed, exactly as the source recorded them. For unilateral movements this is per side.
          example: 5
        rest_after_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          description: Rest taken after this set, within its exercise. Rest between exercises is not represented.
          example: 120
        rir:
          anyOf:
          - type: number
          - type: 'null'
          description: Reps in reserve. Never converted to or from rpe.
        rpe:
          anyOf:
          - type: number
          - type: 'null'
          description: Rate of perceived exertion, on a 0-10 scale.
          example: 8.5
        set_type:
          anyOf:
          - $ref: '#/components/schemas/StrengthSetType'
          - type: 'null'
          description: The type of set as reported by the source, such as normal, warmup, dropset or failure. Open enum — handle unknown values gracefully. unknown when the source does not classify the
            set.
          example: normal
        start_time:
          anyOf:
          - type: string
          - type: 'null'
          description: Start of the set, ISO 8601. Null when the source does not timestamp sets.
        weight_kg:
          anyOf:
          - type: number
          - type: 'null'
          description: 'Load as the source logged it: a barbell''s total, or one dumbbell. Never negative. Null when load_type is unknown, and may also be null for a load_type you do not recognise.'
          example: 100
      required:
      - load_type
    StrengthExercise:
      type: object
      properties:
        exercise_name:
          anyOf:
          - type: string
          - type: 'null'
          description: The source's own label for the exercise, passed through verbatim. Present whenever the source names the exercise, whether or not it resolved to a movement. Intended for display.
          example: Close Grip Bench Press
        movements:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StrengthMovement'
          - type: 'null'
          description: 'The joint actions performed, in the order one repetition performs them, with implement, grip, stance, tempo and position all carried in modifiers. Usually one; a clean and jerk is
            [clean, jerk]. This is the rollup axis, and membership is what to test: a clean and jerk belongs in both clean volume and jerk volume, so ask whether movements contains the value rather than
            equals it. Open enum — handle unknown values gracefully. Empty when the exercise could not be resolved, in which case exercise_name still says what the source called it.'
        target:
          anyOf:
          - $ref: '#/components/schemas/StrengthTarget'
          - type: 'null'
          description: The body part a stretch or mobility drill targets.
        modifiers:
          anyOf:
          - $ref: '#/components/schemas/StrengthExerciseModifiers'
          - type: 'null'
          description: 'The axes that qualify the exercise. An axis that is absent was not reported by the source — it does NOT mean a default applies, so a squat with no implement is not the same as a
            bodyweight squat. Axes describe the exercise as performed rather than each movement separately: in a step up to a deficit reverse lunge only the lunge is at a deficit, but the axis describes
            the whole exercise and exercise_name carries the detail.'
        primary_muscles:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StrengthMuscle'
          - type: 'null'
          description: 'The muscles the exercise primarily works, as reported by the source. A list because providers differ: some name exactly one, some name several for the same exercise, and some name
            none. Empty means the source did not say, not that no muscle is worked. Open enum — handle unknown values gracefully.'
        secondary_muscles:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StrengthMuscle'
          - type: 'null'
          description: The muscles the exercise works without being the focus, as reported by the source. Kept apart from primary_muscles because the distinction drives recovery and volume-per-muscle, which
            merging the two would lose. Empty means the source did not say. Open enum — handle unknown values gracefully.
        group_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Exercises sharing a value were performed together, as a superset or circuit. Unique within this activity only.
          example: 1
        notes:
          anyOf:
          - type: string
          - type: 'null'
          description: The user's note on the exercise.
        rpe:
          anyOf:
          - type: number
          - type: 'null'
          description: Effort for the exercise as a whole, on a 0-10 scale, when the source records it once per exercise rather than per set.
          example: 8.5
        source:
          anyOf:
          - $ref: '#/components/schemas/StrengthSource'
          - type: 'null'
          description: 'Where the exercise came from. Open enum — handle unknown values gracefully; the values in use today are user_logged, device_detected and unknown. Only user_logged is user-confirmed.
            Test for user_logged rather than testing against device_detected, so that a value added later is not trusted by default: anything that is not user_logged may have been inferred by a wearable
            and may be wrong, rep counts included.'
        sets:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/StrengthSet'
          - type: 'null'
          description: The performed sets, in order.
