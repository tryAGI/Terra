        '404':
          $ref: '#/components/responses/NotFound'
  /nutrition:
    get:
      summary: Retrieve nutrition data
      description: Returns nutrition data such as meal type, calories and macronutrients.
      tags:
      - Nutrition
      operationId: Nutrition_Get
      parameters:
      - name: user_id
        in: query
        description: Terra user ID (UUID format) to retrieve data for
        schema:
          type: string
        required: true
      - name: start_date
        in: query
        description: Start date for data query - either ISO8601 date (YYYY-MM-DD) or unix timestamp in seconds (10-digit)
        schema:
          oneOf:
          - type: integer
          - type: string
            format: date
        required: true
      - name: end_date
        in: query
        description: End date for data query - either ISO8601 date (YYYY-MM-DD) or unix timestamp in seconds (10-digit)
        schema:
          oneOf:
          - type: integer
          - type: string
            format: date
        required: false
      - name: to_webhook
        in: query
        description: 'Boolean flag specifying whether to send the data retrieved to the webhook instead of in the response (default: true if not provided)

          '
        schema:
