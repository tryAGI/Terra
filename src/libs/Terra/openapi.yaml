        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workouts:
    post:
      tags:
      - Workouts
      summary: Create a workout template
      description: 'Stores a reusable workout template. Plan it onto a user''s calendar with `POST /workouts/{workout_id}/plan`; the template itself carries no date and is not pushed to any provider until
        planned.

        '
      operationId: Workouts_CreateWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutTemplate'
      responses:
        '200':
          description: Template stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  workout_id:
                    type: string
                    example: '1024'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Workouts
      summary: List workout templates
      description: Returns every workout template stored for your developer account.
      operationId: Workouts_ListWorkouts
      responses:
        '200':
          description: Stored templates, each including its workout_id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workouts/{workout_id}:
    get:
      tags:
      - Workouts
      summary: Get a workout template
      operationId: Workouts_GetWorkout
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The stored template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Workouts
      summary: Delete a workout template
      description: 'Deletes the template and cascades deletion of every planned workout created from it, including removal from connected providers.

        '
      operationId: Workouts_DeleteWorkout
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Template and all planned instances deleted
        '207':
          description: 'Some provider-side deletions failed; the template is retained. Retry to complete the cascade.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          description: Provider-side deletion could not be performed; retry later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /workouts/{workout_id}/plan:
    post:
      tags:
      - Workouts
      summary: Plan a workout onto a user's calendar
      description: 'Schedules the workout template for a user on a given date and pushes it to the user''s connected provider (or queues it for SDK delivery). Athlete metrics personalise zone-based targets
        for this plan only.

        '
      operationId: Workouts_PlanWorkout
      parameters:
      - name: workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: user_id
        in: query
        required: true
        description: Terra user ID of the connection to plan the workout for
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planned_date
              properties:
                planned_date:
                  type: string
                  format: date
                  description: Date to schedule the workout on (YYYY-MM-DD)
                ftp:
                  type: number
                  description: Functional Threshold Power in watts
                max_heart_rate:
                  type: number
                  description: Maximum heart rate in BPM
                threshold_heart_rate:
                  type: number
                  description: Threshold heart rate in BPM
                threshold_speed:
                  type: number
                  description: Threshold speed in m/s
                pool_length_meters:
                  type: number
                  description: Pool length in meters (overrides the template value)
      responses:
        '201':
          description: Planned workout created and pushed (or queued for SDK delivery)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  planned_workout_id:
                    type: string
                    example: '2048'
                  provider_workout_id:
                    type: string
                    description: Identifier assigned by the provider. Absent for SDK-delivered plans.
                  coercion_warnings:
                    type: string
                    description: Set when the template could not be represented exactly on the provider.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The Planned Workouts add-on is not enabled for this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          description: The provider rejected the workout push; retry later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /plannedWorkouts:
    get:
      tags:
      - Workouts
      summary: List planned workouts
      description: 'Returns the user''s planned workouts, including workouts created on the provider side (is_external true) where the provider exposes them. External workouts carry their full body (title,
        description, planned metrics, structured steps) under `details`; they are fetched live from the provider and are not stored by Terra. Note that providers may limit how far ahead planned workouts
        are visible.

        '
      operationId: Workouts_ListPlannedWorkouts
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Start of the planned-date window (YYYY-MM-DD). When start_date and end_date are omitted, provider-side workouts default to the trailing 30 days; pass an explicit window to list upcoming
          workouts.

          '
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: End of the planned-date window (YYYY-MM-DD), inclusive.
      responses:
        '200':
          description: Planned workouts for the connection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlannedWorkout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /plannedWorkouts/{planned_workout_id}:
    get:
      tags:
      - Workouts
      summary: Get a planned workout
      description: 'Returns a planned workout created through Terra. Provider-created (external) workouts are not addressable by id — they are returned by the list endpoint with their full body under `details`.

        '
      operationId: Workouts_GetPlannedWorkout
      parameters:
      - name: planned_workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: user_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The planned workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedWorkoutSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Workouts
      summary: Reschedule a planned workout
      operationId: Workouts_UpdatePlannedWorkout
      parameters:
      - name: planned_workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: user_id
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planned_date
              properties:
                planned_date:
                  type: string
                  format: date
                  description: New scheduled date (YYYY-MM-DD)
      responses:
        '200':
          description: Updated planned workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedWorkoutSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The Planned Workouts add-on is not enabled for this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Workouts
      summary: Delete a planned workout
      description: Removes the planned workout from the user's calendar and from the connected provider.
      operationId: Workouts_DeletePlannedWorkout
      parameters:
      - name: planned_workout_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: user_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Planned workout deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /userInfo:
    get:
      tags:
      - User
      operationId: User_Get
      description: Returns the Terra user for a given user ID, or every user registered under a given reference ID.
      summary: Get user info by user ID or reference ID
      parameters:
      - name: user_id
        in: query
        description: user ID to query for
        schema:
          type: string
        required: false
      - name: reference_id
        in: query
        description: reference ID to query for
        schema:
          type: string
        required: false
      responses:
        '200':
          description: Returned when the provided resources are found
          content:
            application/json:
              schema:
                oneOf:
                - description: User information for one connection (single User object)
                  type: object
                  properties:
                    user:
                      description: 'The connection. In addition to the base User fields, this endpoint also returns polling metadata.

                        '
                      allOf:
                      - $ref: '#/components/schemas/TerraUser'
                      - type: object
                        properties:
                          last_polled_at:
                            type: string
                            format: date-time
                            description: Last time Terra polled the provider for this connection.
                            example: '2024-01-20T11:00:00Z'
                            nullable: true
                          most_recent_data_at:
                            type: string
                            format: date-time
                            description: Timestamp of the most recent data point Terra holds for this connection.
                            example: '2024-01-19T23:00:00Z'
                            nullable: true
                    status:
                      type: string
                      enum:
                      - success
                      - error
                      default: success
                    is_authenticated:
                      type: boolean
                - description: List of multiple User objects the reference_id is associated to
                  type: array
                  items:
                    $ref: '#/components/schemas/TerraUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      tags:
      - User
      operationId: User_List
      description: Returns all Terra users. Supports optional pagination via `page` and `per_page`; if `page` is omitted, every user is returned in one response for backwards compatibility.
      summary: List all user IDs
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Zero-based page number. If omitted, results are not paginated.
        example: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Number of results per page (default is 500).
        example: 500
      responses:
        '200':
          description: Returned upon a successful request
          content:
            application/json:
              schema:
                type: object
                description: If `page` is omitted, `users` contains every user. If `page` is provided, `results`, `max_page`, and `next` contain the paginated response.
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    default: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/TerraUser'
                  next:
                    type: integer
                    description: The next page number, or null if there is no next page
                    nullable: true
                  max_page:
                    type: integer
                    description: Total number of pages available for the requested page size
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TerraUser'
        '400':
          $ref: '#/components/responses/BadRequest'
  /bulkUserInfo:
    post:
      tags:
      - User
      operationId: User_BatchGet
      description: Returns the Terra users for a batch of user IDs.
      summary: Get info for multiple users
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: List of user IDs to get information for
              items:
                type: string
        required: true
      responses:
        '200':
          description: Returned upon successful request
          content:
            application/json:
              schema:
                description: List of User objects
                type: array
                items:
                  $ref: '#/components/schemas/TerraUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /integrations:
    get:
      summary: List available integrations
      tags:
      - Integrations
      operationId: Integrations_List
      description: Returns all provider integrations available on the API.
      security: []
      responses:
        '200':
          description: Returns list of all available integrations on the API
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      example: FITBIT
                  sdk_providers:
                    type: array
                    description: Providers available through Terra's mobile SDKs rather than cloud connections
                    items:
                      type: string
                      example: APPLE
                  status:
                    enum:
                    - success
                    - error
                    type: string
                    default: success
  /integrations/detailed:
    get:
      tags:
      - Integrations
      operationId: Integrations_ListDetailed
      summary: List integrations with details
      description: Returns supported integrations with details, optionally filtered to your enabled integrations and to those that require the SDK.
      parameters:
      - in: query
        name: sdk
        required: false
        schema:
          type: boolean
        description: If `true`, allows SDK integrations to be included in the response.
      responses:
        '200':
          description: Successful response containing a list of integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsResponse'
      security: []
  /lab-reports:
    post:
      summary: Upload a lab report
      description: Upload a single lab report file (PDF, PNG, JPEG, GIF, or WebP) as multipart form data. Returns an `upload_id`; a single upload may fan out to multiple sessions, so learn the `session_id`(s)
        from the webhook events or from `GET /lab-reports?upload_id=...`.
      tags:
      - LabReports
      operationId: LabReports_Upload
      parameters:
      - name: reference_id
        in: query
        required: false
        description: Your external identifier for this report or patient.
        schema:
          type: string
        example: patient_456
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The lab report file (PDF, PNG, JPEG, GIF, or WebP; max 20 MB).
      responses:
        '202':
          description: Upload accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReportUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    get:
      summary: List lab report sessions
      description: List lab report sessions for your account, with optional reference, upload, and inclusive date-range filters. Use the date filters to narrow large result sets.
      tags:
      - LabReports
      operationId: LabReports_List
      parameters:
      - name: reference_id
        in: query
        required: false
        description: Filter by your external reference ID.
        schema:
          type: string
      - name: upload_id
        in: query
        required: false
        description: Filter by upload handle — returns every report from that upload.
        schema:
          type: string
      - name: report_date_from
        in: query
        required: false
        description: Lab report date lower bound (inclusive, ISO-8601 `YYYY-MM-DD`).
        schema:
          type: string
          format: date
      - name: report_date_to
        in: query
        required: false
        description: Lab report date upper bound (inclusive, ISO-8601 `YYYY-MM-DD`).
        schema:
          type: string
          format: date
      - name: uploaded_at_from
        in: query
        required: false
        description: Upload date lower bound (inclusive, ISO-8601 `YYYY-MM-DD`).
        schema:
          type: string
          format: date
      - name: uploaded_at_to
        in: query
        required: false
        description: Upload date upper bound (inclusive, ISO-8601 `YYYY-MM-DD`).
        schema:
          type: string
          format: date
      responses:
        '200':
          description: A list of lab report sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReportListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /lab-reports/{session_id}:
    get:
      summary: Retrieve a lab report session
      description: Retrieve a report's metadata, results, reference ranges, and status history. Immutable and cacheable — presigned file URLs and mutable per-destination delivery state live on the `/files`
        and `/deliveries` sub-resources.
      tags:
      - LabReports
      operationId: LabReports_Get
      parameters:
      - name: session_id
        in: path
        required: true
        description: The session's snowflake ID.
        schema:
          type: string
        example: '297405620317847552'
      responses:
        '200':
          description: The lab report session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReportSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a lab report session
      description: Soft-delete a session. It is marked deleted immediately; associated storage is cleaned up by a background process.
      tags:
      - LabReports
      operationId: LabReports_Delete
      parameters:
      - name: session_id
        in: path
        required: true
        description: The session's snowflake ID.
        schema:
          type: string
        example: '297405620317847552'
      responses:
        '204':
          description: The session was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lab-reports/{session_id}/deliveries:
    get:
      summary: List delivery outcomes
      description: The per-destination delivery state for a report. Each opted-in destination is tracked independently, so one failure never hides delivery to the others (and is why a session can be `partially_sent`).
      tags:
      - LabReports
      operationId: LabReports_ListDeliveries
      parameters:
      - name: session_id
        in: path
        required: true
        description: The session's snowflake ID.
        schema:
          type: string
        example: '297405620317847552'
      responses:
        '200':
          description: Per-destination delivery outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReportDeliveriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lab-reports/{session_id}/files:
    get:
      summary: List input files
      description: The uploaded input files and report thumbnail, with freshly minted presigned download URLs. URLs expire; fetch again to mint new ones.
      tags:
      - LabReports
      operationId: LabReports_ListFiles
      parameters:
      - name: session_id
        in: path
        required: true
        description: The session's snowflake ID.
        schema:
          type: string
        example: '297405620317847552'
      responses:
        '200':
          description: Input files and thumbnail with presigned URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReportFilesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
webhooks:
  auth:
    post:
      description: Fires when a user completes or abandons connecting a provider account through Terra. The success arm (type `auth`) carries the new `user` object and your `reference_id`; the failure or
        cancellation arm (type `auth_cancelled`) carries no user, only a `reason` and the `reference_id`. On success, persist the user and link it to your end user through `reference_id`; on cancellation,
        treat it as a failed attempt with nothing to store.
      summary: User authentication event
      operationId: Webhooks_UserAuth
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AuthSuccessEvent'
              - $ref: '#/components/schemas/AuthErrorEvent'
            examples:
              authSuccess:
                summary: Successful authentication
                value:
                  type: auth
                  status: success
                  message: User has successfully authenticated
                  widget_session_id: 3e982b74-1a94-4d9a-b6a3-f92c6e4d21b5
                  user:
                    user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                    provider: GARMIN
                    last_webhook_update: null
                    scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                    reference_id: your-user-123
                    active: true
              authCancelled:
                summary: Failed or cancelled authentication
                value:
                  type: auth_cancelled
                  status: error
                  flow_id: b2f9c611-52c8-4a63-9082-7e50e2f5a1cd
                  reason: access_denied
                  reference_id: your-user-123
      responses:
        '200':
          description: Successful authentication response
  deauth:
    post:
      description: Fires when a user disconnects a previously connected provider account. Carries the affected `user`, identified by `user_id`. Remove that user and their stored data from your system according
        to your data-retention policy.
      summary: User deauthentication event
      operationId: Webhooks_UserDeauth
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeauthEvent'
            example:
              type: deauth
              status: success
              message: User has deauthenticated
              user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-07-01T09:12:33.891000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: false
      responses:
        '200':
          description: Successful deauthentication response
  user_reauth:
    post:
      description: Fires when a user re-authenticates a provider already connected under the same `reference_id`, which replaces the old connection with a new `user_id`. The payload carries both `old_user`,
        the record being deleted, and `new_user`, the replacement. Re-key your storage from `old_user.user_id` to `new_user.user_id` and drop the old record; a normal `auth` event is delivered for the same
        reconnection.
      summary: User reauthentication event
      operationId: Webhooks_UserReauth
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReauthEvent'
            example:
              type: user_reauth
              status: warning
              message: User has reauthenticated and old ID has been deleted
              version: '2022-03-16'
              new_user:
                user_id: 9c8b7a65-4321-4fed-a0b9-87c6d5e4f321
                provider: GARMIN
                last_webhook_update: '2026-07-02T08:03:11.204000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: true
              old_user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-06-28T17:40:52.118000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: false
      responses:
        '200':
          description: Successful reauthentication response
  access_revoked:
    post:
      description: Fires when a user revokes Terra's access from the provider's side, for example in their wearable app's settings. Carries the affected `user`. Remove the user and their stored data according
        to your data-retention policy.
      summary: Access revoked event
      operationId: Webhooks_AccessRevoked
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRevokedEvent'
            example:
              type: access_revoked
              status: warning
              message: User revoked access
              user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-07-01T09:12:33.891000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: false
      responses:
        '200':
          description: Successful access revocation response
  permission_change:
    post:
      description: 'Fires when the set of scopes a user has granted changes on the provider side. Carries the `user` with its current `scopes`, along with `scopes_added` and `scopes_removed`. Treat it as
        informational: it explains why some data types may later start or stop being delivered.'
      summary: Permission change event
      operationId: Webhooks_PermissionChange
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionChangeEvent'
            example:
              type: permission_change
              status: warning
              message: User permissions have been modified
              version: '2022-03-16'
              scopes_added: BODY_EXPORT
              scopes_removed: ''
              user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-07-01T09:12:33.891000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT,BODY_EXPORT
                reference_id: your-user-123
                active: true
      responses:
        '200':
          description: Successful permission change response
  connection_error:
    post:
      description: Fires when a request to a provider returns HTTP 401, 403 or 412, meaning the stored credentials are no longer valid. Carries the affected `user`. Unlike `access_revoked`, Terra cannot
        tell whether the user deliberately revoked access or the failure is transient, so prompt the user to reconnect before removing their data.
      summary: Connection error event
      operationId: Webhooks_ConnectionError
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionErrorEvent'
            example:
              type: connection_error
              status: warning
              message: 'Connection degraded: the provider rejected Terra''s access token; the user may need to reauthenticate'
              user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-07-01T09:12:33.891000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: true
      responses:
        '200':
          description: Successful connection error response
  large_request_sending:
    post:
      description: Fires just before Terra begins delivering the data for a large historical request of more than one month. Carries `expected_payloads`, the number of chunked data events that will follow,
        all sharing one `terra_reference`. Use it to track sync progress and to know when every chunk has arrived.
      summary: Large request sending event
      operationId: Webhooks_LargeRequestSending
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LargeRequestSendingEvent'
            example:
              type: large_request_sending
              reference: d3f1a9c2-6b1e-4f0a-8f21-9e5b2c7a4d10
              message: Large request payloads are being sent
              expected_payloads: 43
              user:
                user_id: 40f7b0e1-89e2-43ac-a5b8-1e29c8d47cad
                provider: GARMIN
                last_webhook_update: '2026-07-01T09:12:33.891000+00:00'
                scopes: ACTIVITY_EXPORT,HEALTH_EXPORT
                reference_id: your-user-123
                active: true
      responses:
        '200':
          description: Successful large request sending response
  large_request_processing:
    post:
      description: Fires when you request more than one month of a user's data, acknowledging that Terra has begun assembling it. The data follows as a series of data events that share one `terra_reference`,
        each capped at 10 MB. Correlate the chunks back to the original request through `terra_reference`; a `large_request_sending` event announces how many will arrive.
      summary: Large request processing event
      operationId: Webhooks_LargeRequestProcessing
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LargeRequestProcessingEvent'
            example:
              type: large_request_processing
              status: processing
              reference: d3f1a9c2-6b1e-4f0a-8f21-9e5b2c7a4d10
