            or UNSPECIFIED where the device reported a trigger we do not recognise. Devices commonly record automatic splits (DISTANCE, TIME) in the same activity as the laps the athlete pressed for (MANUAL),
            so filter on this to isolate one stream rather than treating every lap as equivalent. Null for providers that do not report a lap trigger.'
          example: MANUAL
